# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - bs42-admin

on:
 push:
  branches:
   - main
 workflow_dispatch:

# CONFIGURATION
# For help, go to https://github.com/Azure/Actions
#
# 1. Set up the following secrets in your repository:
#   YOUR_AZURE_APPSERVICE_PUBLISHPROFILE
#
# 2. Change these variables for your configuration:
env:
 AZURE_WEBAPP_NAME: bs42-client # set this to your application's name
 AZURE_WEBAPP_SLOT_NAME: Production # set this to your application's slot name
 AZURE_WEBAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
 NODE_VERSION: '18.x' # set this to the node version to use
 ZIP_PACKAGE_NAME: app-release.zip

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v2

   - name: Set up Node.js version
     uses: actions/setup-node@v1
     with:
      node-version: ${{ env.NODE_VERSION }}

   - name: npm install, build, and test
     run: |
      npm install
      npm run build --if-present
      npm run test --if-present

   - name: Zip all files for upload between jobs
     run: zip ${{ env.ZIP_PACKAGE_NAME }} ./* .next -qr

   - name: Upload artifact for deployment job
     uses: actions/upload-artifact@v2
     with:
      name: ${{ env.AZURE_WEBAPP_NAME }}
      path: ${{ env.ZIP_PACKAGE_NAME }}
      retention-days: 1

 deploy:
  runs-on: ubuntu-latest
  needs: build
  environment:
   name: 'Production'
   url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

  steps:
   - name: Download artifact from build job
     uses: actions/download-artifact@v2
     with:
      name: ${{ env.AZURE_WEBAPP_NAME }}

   - name: 'Deploy to Azure Web App'
     id: deploy-to-webapp
     uses: azure/webapps-deploy@v2
     with:
      app-name: ${{ env.AZURE_WEBAPP_NAME }}
      slot-name: ${{ env.AZURE_WEBAPP_SLOT_NAME }}
      publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FF339F2E30EF40D69926B4083F742231 }}
      package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/${{ env.ZIP_PACKAGE_NAME }}

   - name: Delete zip file
     run: rm ${{ env.ZIP_PACKAGE_NAME }}
